<text x="528" y="181" font-family="Montserrat,Arial" font-size="13" fill="#111">Intro</text><text x="584" y="181" font-family="Montserrat,Arial" font-size="13" fill="#111">Explore</text><text x="652" y="181" font-family="Montserrat,Arial" font-size="13" fill="#111">About</text><text x="710" y="181" font-family="Montserrat,Arial" font-size="13" fill="#111">Collaborations</text><text x="817" y="181" font-family="Montserrat,Arial" font-size="13" fill="#111">Experts</text>
<g transform="translate(1140 166)" fill="none" stroke="#111" stroke-width="1.4"><rect width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="4"/><circle cx="13" cy="4" r="1" fill="#111" stroke="none"/></g>
<text x="105" y="790" font-family="Montserrat,Arial" font-size="94" font-weight="800" letter-spacing="5" fill="#19a84b">MM</text>
