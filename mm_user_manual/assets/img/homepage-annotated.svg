<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">Annotated Maison Magnolia homepage landing view</title>
<desc id="desc">A simplified desktop screenshot showing the navigation at the top, Instagram at top right, a full-screen white landing area, and the green MM home button at bottom left.</desc>
